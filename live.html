<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SMARTWASH — как работает мойка</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1080px,100% - 32px);margin:64px auto 96px}
</style><style>
.sw-brand{fill:#FFC400;stroke:none}
.sw-ink{fill:#111 !important}
.sw-screen{fill:var(--anatomy-faint);stroke:var(--anatomy-lo);stroke-width:.5px;transition:fill .3s}
.sw-screen[data-on]{fill:#FFC400}
.sw-led>.iso-top,.sw-led>.iso-shade{fill:var(--anatomy-hi)}
.sw-glass>.iso-shade{fill:var(--anatomy-shade-0)}
body[data-theme="light"] .sw-glass>.iso-shade{fill:#c9ced6}
.sw-hub{fill:var(--anatomy-mid)}
.sw-lamp{fill:var(--anatomy-hi)}
.sw-tail{fill:var(--anatomy-red);opacity:.85}
.sw-dot{fill:var(--anatomy-hi)}
.sw-foam circle{fill:#ffffff;stroke:var(--anatomy-mid);stroke-width:.35px}
body[data-theme="light"] .sw-foam circle{fill:#ffffff;stroke:#9a9aa0}
.sw-spray{fill:none;stroke:#6bb8ff;stroke-width:.9px;stroke-dasharray:1.6 2.4;stroke-linecap:round;opacity:.9}
.sw-spray[data-kind="wax"]{stroke:#e8c87a}
.sw-spray[data-kind="foam"]{stroke:#ffffff;stroke-width:1.6px;stroke-dasharray:2 1.6}
body[data-theme="light"] .sw-spray{stroke:#2f7fd6}
body[data-theme="light"] .sw-spray[data-kind="foam"]{stroke:#b9b9c0}
.sw-mist circle{fill:#6bb8ff;opacity:.35}
.sw-hose{fill:none;stroke:var(--anatomy-mid);stroke-width:.9px;stroke-linecap:round}
.sw-shutter-slats{fill:none;stroke:var(--anatomy-lo);stroke-width:.4px}
.sw-bar{display:flex;flex-direction:column;gap:10px;padding:4px 18px 16px;font:12px/1.4 var(--anatomy-mono);color:var(--anatomy-text)}
.sw-stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.iso-stage{position:relative}
.sw-start{all:unset;cursor:pointer;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 34px 16px;border-radius:16px;background:#FFC400;color:#16181C;font:600 20px/1.1 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 12px 40px #0008,0 0 0 6px #FFC40033;transition:transform .2s var(--anatomy-ease),box-shadow .2s}
.sw-start:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:0 14px 44px #0009,0 0 0 9px #FFC40040}
.sw-start:focus-visible{outline:3px solid #fff;outline-offset:4px}
.sw-start-ico{font-size:30px;line-height:1}
.sw-start small{font:400 11px/1.2 var(--anatomy-mono);letter-spacing:.04em;text-transform:none;opacity:.75}
.iso-stage[data-paused] svg{filter:saturate(.85)}
.sw-ctl{display:inline-flex;gap:6px}
.sw-btn{all:unset;cursor:pointer;padding:4px 11px;border-radius:6px;box-shadow:0 0 0 1px var(--anatomy-faint);color:var(--anatomy-strong);font:12px/1.4 var(--anatomy-mono)}
.sw-btn:hover{box-shadow:0 0 0 1px var(--anatomy-mid)}
.sw-btn:focus-visible{outline:2px solid #FFC400;outline-offset:2px}
.sw-play{background:#FFC400;color:#16181C;box-shadow:none;font-weight:600}
.sw-play[aria-pressed="true"]{background:transparent;color:var(--anatomy-strong);box-shadow:0 0 0 1px #FFC400}
@media (max-width:640px){.sw-start{padding:12px 22px 11px;font-size:16px}.sw-start-ico{font-size:22px}}
.sw-season{all:unset;cursor:pointer;margin-left:auto;padding:3px 9px;border-radius:6px;box-shadow:0 0 0 1px var(--anatomy-faint);color:var(--anatomy-muted)}
.sw-season[aria-pressed="true"]{box-shadow:0 0 0 1px #6bb8ff;color:var(--anatomy-strong)}
.sw-stats b{color:var(--anatomy-strong);font-weight:500}
.sw-chips{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sw-chip{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 7px;border-radius:7px;box-shadow:0 0 0 1px var(--anatomy-faint);color:var(--anatomy-muted);min-width:0}
.sw-chip b{color:var(--anatomy-strong);font-weight:500}
.sw-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.sw-chip[data-busy] span{color:var(--anatomy-text)}
.sw-chip[aria-pressed="true"]{box-shadow:0 0 0 1px #FFC400;background:color-mix(in srgb,#FFC400 9%,transparent)}
.sw-chip:focus-visible{outline:2px solid #FFC400;outline-offset:2px}
@media (max-width:640px){.sw-chips{grid-template-columns:repeat(4,1fr)}.sw-bar{padding:4px 10px 12px}}
</style><style>

    const d = pathOf(f.map((p) => iso(p, P)), true);
    fill.push(d);
    edges.push(d);
    if (nn[2] > 0.55) tops.push(d);
    else {
      const h = Math.hypot(nn[0], nn[1]) || 1;
      const litv = ((nn[0] / h) * -sinA + (nn[1] / h) * cosA + 1) / 2;
      shades[Math.min(3, Math.max(0, Math.floor(litv * 4)))].push(d);
    }
  }
  const parts = [`<path class="iso-fill" d="${fill.join("")}"/>`];
  shades.forEach((list, s) => list.length && parts.push(`<path class="iso-shade" data-shade="${s}" d="${list.join("")}"/>`));
  if (tops.length) parts.push(`<path class="iso-top" d="${tops.join("")}"/>`);
  if (inner) parts.push(inner);
  parts.push(`<path class="iso-line iso-edge" data-tone="${tone}" d="${edges.join("")}"/>`);
  return `<g class="iso-solid${cls ? " " + cls : ""}"${lit ? " data-lit" : ""}>${parts.join("")}</g>`;
}

// rounded rect in a local frame (u forward, v left) rotated by heading h, extruded up
function partRing(pose, u0, u1, v0, v1, r, steps = 3) {
  const c = Math.cos(pose.h);
  const s = Math.sin(pose.h);
  return roundedPlan({ x: u0, y: v0, w: u1 - u0, d: v1 - v0, r }, steps).map(([u, v]) => [pose.x + u * c - v * s, pose.y + u * s + v * c]);
}
const local = (pose, u, v, z = 0) => [pose.x + u * Math.cos(pose.h) - v * Math.sin(pose.h), pose.y + u * Math.sin(pose.h) + v * Math.cos(pose.h), z];

// ---- a car as depth-sortable parts ----
function carParts(car, P, { lit = false, foam = 0 } = {}) {
  const out = [];
  const wrap = (svg) => (car.alpha !== undefined && car.alpha < 0.99 ? `<g opacity="${Math.max(0, car.alpha).toFixed(2)}">${svg}</g>` : svg);
  const add = (u, v, z, svg) => {
    const c = local(car, u, v, z);
    out.push({ key: depthOf(c, P), x: c[0], y: c[1], svg: wrap(svg) });
  };
  const S = (ring, z, h, style) => solidSvg(extrude(ring, z, h, P, { bevel: style.bevel || 0 }), style);
  const tone = car.tone || "hi";
  // tyres
  for (const u of [-14.2, 14.2])
    for (const side of [-1, 1]) {
      const v0 = side > 0 ? 5.9 : -8.5;
      const ring = partRing(car, u - 3.3, u + 3.3, v0, v0 + 2.6, 1.8, 4);
      add(u, side * 7.2, -40, S(ring, 0, 4.2, { tone: "mid", crease: "none" }));
    }
  // body: rear, middle, front (panel gaps are real seams)
  const seg = [
    [-22.5, -8.5, 2.2, 7.2, 1.6],
    [-8.5, 8.5, 2.2, 7.0, 0.8],
    [8.5, 22.5, 2.2, 6.2, 1.8],
  ];
  seg.forEach(([u0, u1, z, h, r], index) => {
    const ring = partRing(car, u0, u1, -8.8, 8.8, r, 4);
    let inner = "";
    if (index === 2) {
      // headlights
      const a = iso(local(car, 22.2, -6, 6.6), P);
      const b = iso(local(car, 22.2, 6, 6.6), P);
      inner = `<circle class="sw-lamp" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="0.9"/><circle class="sw-lamp" cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="0.9"/>`;
    }
    if (index === 0) {
      const a = iso(local(car, -22.4, -6.4, 7.4), P);
      const b = iso(local(car, -22.4, 6.4, 7.4), P);
      inner = `<circle class="sw-tail" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="0.85"/><circle class="sw-tail" cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="0.85"/>`;
    }
    add((u0 + u1) / 2, 0, z + h / 2, S(ring, z, h, { tone, crease: "lo", bevel: 0.6, lit, inner }));
  });
  // greenhouse + roof
  const cabin = partRing(car, -11, 7.5, -7.6, 7.6, 1.4, 3);
  const belt = lineSvg(pathOf(cabin.map(([x, y]) => iso([x, y, 10.6], P)), true), { tone: "faint" });
  add(-1.5, 0, 12.5, S(cabin, 9.2, 5.6, { tone, crease: "lo", lit, inner: belt, className: "sw-glass" }));
  const roof = partRing(car, -9.5, 5.5, -6.8, 6.8, 1.2, 3);
  const rails = [-4.6, 4.6].map((v) => lineSvg(pathOf([iso(local(car, -8, v, 15.4), P), iso(local(car, 4, v, 15.4), P)]), { tone: "lo" })).join("");
  add(-1.5, 0, 15.2, S(roof, 14.8, 0.6, { tone, crease: "none", lit }) + rails);
  // mirrors
  for (const side of [-1, 1]) {
    const ring = partRing(car, 6.2, 7.6, side > 0 ? 8.6 : -10.4, side > 0 ? 10.4 : -8.6, 0.4, 2);
    add(6.9, side * 9.5, 10.5, S(ring, 9.8, 1.4, { tone: "mid", crease: "none" }));
  }
  // foam: soft blobs over the top and the near flanks
  if (foam > 0.02) {
    const seed = car.seed || 1;
    let blobs = "";
    for (let i = 0; i < 46; i++) {
      const a = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
      const r1 = a - Math.floor(a);
      const b2 = Math.sin(seed * 39.3468 + i * 11.135) * 24634.6345;
      const r2 = b2 - Math.floor(b2);
      const u = -21 + r1 * 42;
      const onTop = i % 3 !== 0;
      const v = onTop ? -7 + r2 * 14 : (i % 2 ? 9.2 : -9.2);
      const zTop = Math.abs(u) < 8 ? 15.5 : Math.abs(u) < 11 ? 12 : 9;
      const z = onTop ? zTop : 3.5 + r2 * 5;
      const p = iso(local(car, u, v, z), P);
      const show = r1 * 0.7 + r2 * 0.3 < foam * 1.15;
      if (!show) continue;

    const c = local(car, 0, 0, 16);
    out.push({ key: depthOf(c, P) + 30, x: car.x, y: car.y, svg: `<g class="sw-foam" opacity="${Math.min(1, foam * 1.4).toFixed(2)}">${blobs}</g>` });
  }
  return out;
}

// ---- a person (customer with the wash gun) ----
function personParts(pp, P, { gun = false, spray = null } = {}) {
  const out = [];
  const pose = { x: pp.x, y: pp.y, h: pp.h };
  const S = (ring, z, h, tone = "mid") => solidSvg(extrude(ring, z, h, P), { tone, crease: "lo" });
  const step = pp.walk ? Math.sin(pp.walk) * 1.1 : 0;
  let svg = "";
  // legs (back leg first)
  const legs = [-1, 1].map((side) => ({ side, d: depthOf(local(pose, side * step, side * 0.9, 4), P) })).sort((a, b) => a.d - b.d);
  for (const { side } of legs) svg += S(partRing(pose, -0.7 + side * step, 0.7 + side * step, side > 0 ? 0.2 : -1.6, side > 0 ? 1.6 : -0.2, 0.5, 2), 0, 8.6, "lo");
  svg += S(partRing(pose, -1.1, 1.1, -2.1, 2.1, 0.9, 3), 8.6, 5.8, "mid");
  const head = local(pose, 0, 0, 0);
  svg += solidSvg(extrude(roundedPlan({ x: head[0] - 1.1, y: head[1] - 1.1, w: 2.2, d: 2.2, r: 1.1 }, 5), 14.7, 2.5, P), { tone: "mid", crease: "lo" });
  // arms to the gun
  const hand = local(pose, 3.6, -0.6, 10.6);
  const shoulderL = local(pose, 0.4, 2.1, 13.8);
  const shoulderR = local(pose, 0.4, -2.1, 13.8);
  svg += lineSvg(pathOf([iso(shoulderL, P), iso(local(pose, 2.4, 1.6, 11.4), P), iso(hand, P)]), { tone: "mid" });
  svg += lineSvg(pathOf([iso(shoulderR, P), iso(local(pose, 2, -1.8, 11), P), iso(hand, P)]), { tone: "mid" });
  let tip = null;
  if (gun) {
    tip = local(pose, 11.5, -0.6, 8.6);
    svg += `<path class="iso-line" data-tone="hi" style="stroke-width:1.1" d="${pathOf([iso(hand, P), iso(tip, P)])}"/>`;
    svg += `<circle class="sw-dot" cx="${iso(tip, P)[0].toFixed(1)}" cy="${iso(tip, P)[1].toFixed(1)}" r="0.7"/>`;
  }
  out.push({ key: depthOf([pp.x, pp.y, 8], P), x: pp.x, y: pp.y, svg });
  return { parts: out, hand, tip };
}

// sag polyline from a to b
function sagPath(a, b, sag, P, n = 10) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push(iso([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t - sag * 4 * t * (1 - t)], P));
  }
  return pathOf(pts);
}

const { BAYS, X0, CX, DEPTH, PARK_Y, LANE_IN, LANE_OUT, R_IN, R_OUT, OPEN_W, OPEN_H } = SW;
const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const slotIn = BAYS.map((_, i) => svgEl.querySelector(`[data-slot="in${i}"]`));
const slotOut = svgEl.querySelector('[data-slot="out"]');
const shutters = BAYS.map((_, i) => svgEl.querySelector(`[data-shutter="${i}"]`));
const screens = BAYS.map((_, i) => svgEl.querySelector(`.sw-screen[data-bay="${i}"]`));
const readout = document.querySelector("[data-readout]");
const chips = [...document.querySelectorAll("[data-chip]")];
const $ = (s) => document.querySelector(s);
const still = matchMedia("(prefers-reduced-motion: reduce)");

const STAGES = [
  { name: "Вода АВД", dur: 3.0, kind: "water" },
  { name: "Пена", dur: 3.5, kind: "foam" },
  { name: "Мойка АВД", dur: 3.5, kind: "water" },
  { name: "Воск", dur: 2.5, kind: "wax" },
  { name: "Осмос", dur: 2.0, kind: "water" },
];
const WASH = STAGES.reduce((a, s) => a + s.dur, 0);
const PRICE = 900;
const SPEED_LANE = 46, SPEED_ARC = 26, SPEED_BAY = 16, WALK = 13;
const TONES = ["hi", "mid", "hi", "mid", "hi"];

const bays = BAYS.map((w, i) => ({ i, car: null, door: 1, doorTarget: 1, screen: false }));
let cars = [];
let waiting = 0, served = 0, simMin = 9 * 60 + 40, nextSpawn = 0.5, selected = 3, seedN = 1;
let winter = false, paused = true, started = false, tourTimer = 0, userPickedAt = -99, tNow = 0;

const ease = (t) => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (n) => n.toLocaleString("ru-RU").replace(/,/g, " ");
const ellipse = (bay, a) => ({ x: CX[bay] + Math.cos(a) * (BAYS[bay] > 45 ? 17.5 : 16), y: PARK_Y + Math.sin(a) * 31 });

function spawn() {
  const free = bays.filter((b) => !b.car);
  if (!free.length) return false;
  // drivers prefer bays nearer the entry, but not strictly
  free.sort((a, b) => a.i - b.i + (Math.random() - 0.5) * 6);
  const bay = free[0];
  const car = { id: seedN, seed: seedN++, bay: bay.i, state: "lane", x: -95, alpha: 0, y: LANE_IN, h: 0, v: SPEED_LANE, tone: TONES[seedN % TONES.length], t: 0, foam: 0, wet: 0, person: null };
  // keep spacing at the spawn point
  if (cars.some((c) => c.state === "lane" && c.x < -95 + 60)) return false;
  bay.car = car;
  cars.push(car);
  return true;
}

// manoeuvre zones: a car reversing out of bay i needs the arrival lane around [cx-72, cx+30]
// and the exit lane around [m-52, m+26] (m = cx - R_OUT, where it ends up). Cars already in a zone
// drive through; cars approaching a busy zone wait; the reversing car waits until its zone is clear.
const zoneIn = (bay) => [CX[bay] - 72, CX[bay] + 30];
const zoneOut = (bay) => [CX[bay] - R_OUT - 52, CX[bay] - R_OUT + 26];
const manoeuvring = (o) => o.state === "revOut" || o.state === "arcOut";
function blockedLane(car, ahead = 56) {
  for (const o of cars) {
    if (o === car) continue;
    if (o.state === "lane" && o.x > car.x && o.x - car.x < ahead) return true;
    if (manoeuvring(o)) {
      const [a] = zoneIn(o.bay);
      if (car.x < a && a - car.x < 34) return true;
    }
  }
  return false;
}
function blockedExit(car, ahead = 56) {
  for (const o of cars) {
    if (o === car) continue;
    if (o.state === "exitLane" && o.x > car.x && o.x - car.x < ahead) return true;
    if (manoeuvring(o) && o.y > DEPTH - 6) {
      const [a] = zoneOut(o.bay);
      if (car.x < a && a - car.x < 34) return true;
    }
  }
  return false;
}
const inZone = (x, [a, b]) => x >= a && x <= b;
function laneClear(bay) {
  return !cars.some((o) => (o.state === "lane" || o.state === "arcIn") && inZone(o.x, zoneIn(bay)));
}
function exitClear(bay) {
  return !cars.some((o) => o.state === "exitLane" && inZone(o.x, zoneOut(bay)));
}
function canLeave(car) {
  const cx = CX[car.bay];
  for (const o of cars) {
    if (o === car) continue;
    if (manoeuvring(o) && Math.abs(o.x - cx) < 70) return false; // one manoeuvre at a time nearby
    if (o.state === "arcIn" && Math.abs(o.x - cx) < 60) return false;
  }
  return laneClear(car.bay) && exitClear(car.bay);
}

function walkTo(p, target, dt) {
  const dx = target.x - p.x, dy = target.y - p.y, d = Math.hypot(dx, dy);
  if (d < 0.3) { p.x = target.x; p.y = target.y; return true; }
  const s = Math.min(d, WALK * dt);
  p.x += (dx / d) * s; p.y += (dy / d) * s;
  p.h = Math.atan2(dy, dx);
  p.walk = (p.walk || 0) + s * 0.55;
  return false;
}

function stepCar(car, dt) {
  const bay = bays[car.bay];
  const cx = CX[car.bay];
  car.t += dt;
  if (car.state === "lane") car.alpha = Math.min(1, (car.alpha ?? 1) + dt * 1.6);
  if (car.state === "exitLane") car.alpha = clamp((SW.LEN + 95 - car.x) / 40, 0, 1);
  switch (car.state) {
    case "lane": {
      const turnAt = cx - R_IN;
      if (blockedLane(car)) { car.v = Math.max(0, car.v - 120 * dt); }
      else car.v = Math.min(SPEED_LANE, car.v + 60 * dt);
      const near = turnAt - car.x;
      if (near < 40) car.v = Math.min(car.v, lerp(SPEED_ARC, SPEED_LANE, clamp(near / 40, 0, 1)));
      car.x += car.v * dt;
      if (near < 60) bay.doorTarget = 1;
      if (car.x >= turnAt) { car.x = turnAt; car.state = "arcIn"; car.phi = 0; }
      break;
    }
    case "arcIn": {
      car.phi = Math.min(Math.PI / 2, car.phi + (SPEED_ARC / R_IN) * dt);
      const c = { x: cx - R_IN, y: LANE_IN - R_IN };
      car.x = c.x + R_IN * Math.sin(car.phi);
      car.y = c.y + R_IN * Math.cos(car.phi);
      car.h = -car.phi;
      if (car.phi >= Math.PI / 2) { car.state = "enter"; car.h = -Math.PI / 2; }
      break;
    }
    case "enter": {
      if (bay.door < 0.98) break; // wait for the shutter
      const left = car.y - PARK_Y;
      const v = Math.max(3, Math.min(SPEED_BAY, left * 0.9));
      car.y -= v * dt;
      if (car.y <= PARK_Y + 0.05) {
        car.y = PARK_Y; car.state = "park"; car.t = 0; bay.doorTarget = winter ? 0 : 1;
        car.person = { x: cx - 12.5, y: PARK_Y + 6, h: Math.PI, walk: 0, step: "toPay", show: true };
      }
      break;
    }
    case "park": {
      const p = car.person;
      const term = { x: X0[car.bay] + 5.5, y: 68 };
      if (p.step === "toPay") { if (walkTo(p, term, dt)) { p.step = "pay"; car.t = 0; p.h = Math.PI; } }
      else if (p.step === "pay") {
        bay.screen = true;
        if (car.t > 2.2) { bay.screen = false; p.step = "toWash"; }
      } else if (p.step === "toWash") {
        const a0 = Math.PI; // left side of the car
        const target = ellipse(car.bay, a0);
        if (walkTo(p, target, dt)) { p.step = "wash"; car.t = 0; p.a = a0; }
      } else if (p.step === "wash") {
        bay.screen = car.t < 0.4;
        // walk the ellipse: 1.5 laps across the program
        p.a += (Math.PI * 3 / WASH) * dt;
        const prev = { x: p.x, y: p.y };
        const q = ellipse(car.bay, p.a);
        p.x = q.x; p.y = q.y;
        p.walk = (p.walk || 0) + Math.hypot(q.x - prev.x, q.y - prev.y) * 0.55;
        p.h = Math.atan2(PARK_Y - p.y, cx - p.x); // face the car
        const st = stageAt(car.t);
        if (st) {
          if (st.kind === "foam") car.foam = Math.min(1, car.foam + dt / 2.6);
          if (st.kind === "water" && st.name !== "Вода АВД") car.foam = Math.max(0, car.foam - dt / 2.4);
          car.wet = 1;
        }
        if (car.t >= WASH) { p.step = "toCar"; car.foam = 0; }
      } else if (p.step === "toCar") {
        if (walkTo(p, { x: cx - 12.5, y: PARK_Y + 6 }, dt)) { p.step = "in"; p.show = false; car.t = 0; bay.doorTarget = 1; }
      } else if (p.step === "in") {

      }

    }
    case "revOut": {

      let v = Math.min(SPEED_BAY, 4 + (car.y - PARK_Y) * 0.9);

      if (car.y < LANE_OUT - 45 && car.y + v * dt >= LANE_OUT - 45 && !exitClear(car.bay)) v = 0;

      if (!exitClear(car.bay) && car.phi < 0.2) break;
      car.phi = Math.min(Math.PI / 2, car.phi + (SPEED_ARC * 0.8 / R_OUT) * dt);
      const c = { x: cx - R_OUT, y: LANE_OUT - R_OUT };
      car.x = c.x + R_OUT * Math.cos(car.phi);
      car.y = c.y + R_OUT * Math.sin(car.phi);
      car.h = Math.atan2(-Math.cos(car.phi), Math.sin(car.phi));
      if (car.phi >= Math.PI / 2) { car.state = "exitLane"; car.h = 0; car.v = 0; bay.doorTarget = winter ? 0 : 1; }
      break;
    }
    case "exitLane": {
      if (blockedExit(car)) car.v = Math.max(0, car.v - 120 * dt);
      else car.v = Math.min(SPEED_LANE, car.v + 40 * dt);
      car.x += car.v * dt;
      if (car.x > SW.LEN + 96) car.dead = true;
      break;
    }
  }
}
function stageAt(t) {
  let acc = 0;
  for (const s of STAGES) { if (t < acc + s.dur) return { ...s, at: t - acc }; acc += s.dur; }
  return null;
}

// ---------- drawing ----------
function shutterSvg(i, open) {
  const y = DEPTH + 0.35, x0 = CX[i] - OPEN_W / 2, x1 = CX[i] + OPEN_W / 2;
  const zb = OPEN_H * open, zt = OPEN_H;
  if (zt - zb < 0.2) return "";
  const q = [[x0, y, zb], [x1, y, zb], [x1, y, zt], [x0, y, zt]].map((p) => iso(p, P));
  let slats = "";
  for (let z = zt - 1.4; z > zb + 0.3; z -= 1.4) slats += pathOf([iso([x0 + 0.3, y, z], P), iso([x1 - 0.3, y, z], P)]);
  const bar = solidSvg(extrude([[x0, y - 0.2], [x1, y - 0.2], [x1, y + 0.6], [x0, y + 0.6]], zb, 0.9, P), { tone: "mid", crease: "lo" });
  return `<g class="iso-solid"><path class="iso-fill" d="${pathOf(q, true)}"/><path class="iso-shade" data-shade="2" d="${pathOf(q, true)}"/><path class="sw-shutter-slats" d="${slats}"/><path class="iso-line iso-edge" data-tone="mid" d="${pathOf(q, true)}"/></g>${bar}`;
}

function bayOfX(x) {
  for (let i = 0; i < BAYS.length; i++) if (x < X0[i] + BAYS[i]) return i;
  return BAYS.length - 1;
}

function boomParts(i, car) {
  const cx = CX[i];
  const pivot = [cx, 5.2, 26.2];
  const p = car && car.person && car.person.show ? car.person : null;
  const washing = p && p.step === "wash";
  let ang = -Math.PI / 2 + 0.0; // resting: pointing at the door
  ang = Math.PI / 2;
  if (p) ang = Math.atan2(p.y - pivot[1], p.x - pivot[0]);
  const b = bays[i];
  b.boom = b.boom === undefined ? ang : b.boom + (ang - b.boom) * 0.12;
  const A = b.boom, LEN = 26;
  const tip = [pivot[0] + Math.cos(A) * LEN, pivot[1] + Math.sin(A) * LEN, 26];
  const ring = [[0, -0.7], [LEN, -0.5], [LEN, 0.5], [0, 0.7]].map(([u, v]) => [pivot[0] + u * Math.cos(A) - v * Math.sin(A), pivot[1] + u * Math.sin(A) + v * Math.cos(A)]);
  let svg = solidSvg(extrude(ring, 25.6, 1.2, P), { tone: "mid", crease: "lo" });
  const tipS = iso(tip, P);
  svg += `<circle class="sw-dot" cx="${tipS[0].toFixed(1)}" cy="${tipS[1].toFixed(1)}" r="0.8"/>`;
  return { key: depthOf([cx, 22, 26], P) + 40, svg, tip, washing };
}

function draw() {
  const inner = BAYS.map(() => []);
  const outer = EXTRAS.map((e) => ({ key: e.key, svg: e.svg }));
  for (const car of cars) {
    const lit = car.bay === selected && bays[car.bay].car === car;
    const parts = carParts(car, P, { lit, foam: car.foam });
    for (const part of parts) {
      if (part.y < DEPTH - 0.5) inner[bayOfX(part.x)].push(part);
      else outer.push(part);
    }
    // halo under the car
    const hc = local(car, 0, 0, 0);
    const halo = `<path class="iso-halo" style="filter:blur(5px)" d="${pathOf(partRing(car, -21, 21, -8.4, 8.4, 4, 3).map(([x, y]) => iso([x, y, 0], P)), true)}"/>`;
    (hc[1] < DEPTH ? inner[bayOfX(hc[0])] : outer).push({ key: -1e6, svg: (car.alpha ?? 1) < 0.99 ? `<g opacity="${car.alpha.toFixed(2)}">${halo}</g>` : halo });
  }
  BAYS.forEach((w, i) => {
    const b = bays[i];
    const car = b.car && b.car.state === "park" ? b.car : null;
    const boom = boomParts(i, car);
    inner[i].push({ key: boom.key, svg: boom.svg });
    let hoseEnd = [boom.tip[0], boom.tip[1], 13];
    if (car && car.person && car.person.show) {
      const pr = personParts(car.person, P, { gun: car.person.step === "wash" || car.person.step === "toWash" });
      inner[i].push(...pr.parts);
      if (car.person.step === "wash" || car.person.step === "toWash") {
        hoseEnd = pr.hand;
        // spray
        const st = stageAt(car.t);
        if (car.person.step === "wash" && st && pr.tip) {
          const tip = iso(pr.tip, P);
          let d = "";
          let mist = "";
          const n = st.kind === "foam" ? 3 : 4;
          for (let j = 0; j < n; j++) {
            const jit = Math.sin(tNow * 9 + j * 2.1);
            const tx = CX[i] + (car.person.x < CX[i] ? -7 : 7) * 0.55 + jit * 2;
            const ty = PARK_Y + (car.person.y - PARK_Y) * 0.55 + Math.cos(tNow * 7 + j) * 6;
            const tz = 5 + j * 2.6 + jit;
            const target = iso([tx, ty, tz], P);
            d += `M${tip[0].toFixed(1)} ${tip[1].toFixed(1)}L${target[0].toFixed(1)} ${target[1].toFixed(1)}`;
            if (st.kind !== "foam") mist += `<circle cx="${(target[0] + Math.sin(tNow * 13 + j) * 1.5).toFixed(1)}" cy="${(target[1] + Math.cos(tNow * 11 + j) * 1.2).toFixed(1)}" r="${(1.1 + j * 0.25).toFixed(1)}"/>`;
          }
          const off = (-tNow * 30) % 8;
          inner[i].push({ key: depthOf([car.person.x, car.person.y, 9], P) + 0.5, svg: `<path class="sw-spray" data-kind="${st.kind}" style="stroke-dashoffset:${off.toFixed(1)}" d="${d}"/><g class="sw-mist">${mist}</g>` });
        }
      }
    }
    // hose from the boom tip
    const sag = Math.max(1.5, 12 - Math.hypot(hoseEnd[0] - boom.tip[0], hoseEnd[1] - boom.tip[1]) * 0.2);
    inner[i].push({ key: car && car.person && car.person.show ? depthOf([car.person.x, car.person.y, 9], P) + 0.3 : boom.key - 1, svg: `<path class="sw-hose" d="${sagPath(boom.tip, hoseEnd, sag, P)}"/>` });
    inner[i].sort((a, b) => a.key - b.key);
    slotIn[i].innerHTML = inner[i].map((p) => p.svg).join("");
    // shutter
    b.door += (b.doorTarget - b.door) * (1 - Math.exp(-dtLast / 0.55));
    if (Math.abs(b.door - b.doorTarget) < 0.004) b.door = b.doorTarget;
    const key = b.door.toFixed(3);
    if (shutters[i].dataset.k !== key) { shutters[i].innerHTML = shutterSvg(i, b.door); shutters[i].dataset.k = key; }
    if (b.screen) screens[i].setAttribute("data-on", ""); else screens[i].removeAttribute("data-on");
  });
  outer.sort((a, b) => a.key - b.key);
  slotOut.innerHTML = outer.map((p) => p.svg).join("");
  status();
}

const STATE_RU = { lane: "заезд", arcIn: "заезд", enter: "заезд", revOut: "выезд", arcOut: "выезд" };
function bayText(i) {
  const b = bays[i], car = b.car;
  if (!car) return { short: "свободен", long: `Бокс ${i + 1} · свободен` };
  if (car.state !== "park") return { short: STATE_RU[car.state] || "выезд", long: `Бокс ${i + 1} · ${STATE_RU[car.state] || "выезд"}` };
  const p = car.person;
  if (!p) return { short: "выезд", long: `Бокс ${i + 1} · выезд` };
  if (p.step === "toPay" || p.step === "pay") return { short: "оплата", long: `Бокс ${i + 1} · оплата · Kaspi QR / карта` };
  if (p.step === "wash") {
    const st = stageAt(car.t);
    const mm = Math.floor(car.t), ss = Math.floor((car.t % 1) * 60);
    return { short: st ? st.name.toLowerCase() : "мойка", long: `Бокс ${i + 1} · ${st ? st.name : "мойка"} · ${mm}:${String(ss).padStart(2, "0")} из ${Math.round(WASH)} мин` };
  }
  return { short: "мойка", long: `Бокс ${i + 1} · ${p.step === "toWash" ? "берёт пистолет" : "садится в авто"}` };
}
let lastStatus = "";
function status() {
  const texts = BAYS.map((_, i) => bayText(i));
  const sel = texts[selected].long;
  const h = Math.floor(simMin / 60) % 24, m = Math.floor(simMin % 60);
  const busy = bays.filter((b) => b.car).length;
  const sig = sel + served + h + m + busy + texts.map((t) => t.short).join();
  if (sig === lastStatus) return;
  lastStatus = sig;
  readout.textContent = sel;
  $("[data-clock]").textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  $("[data-served]").textContent = String(served);
  $("[data-revenue]").textContent = `${fmt(served * PRICE)} ₸`;
  $("[data-load]").textContent = `${busy}/8`;
  chips.forEach((c, i) => {
    c.setAttribute("aria-pressed", String(i === selected));
    c.querySelector("[data-chip-state]").textContent = texts[i].short;
    if (bays[i].car) c.setAttribute("data-busy", ""); else c.removeAttribute("data-busy");
  });
}

// ---------- loop ----------
let frame = 0, last = 0, visible = true, dtLast = 1 / 60;
function step(dt) {
  tNow += dt;
  simMin += dt; // 1 s = 1 sim minute
  nextSpawn -= dt;
  if (nextSpawn <= 0) { waiting++; nextSpawn = -Math.log(1 - Math.random()) * 5.1; } // ≈280 cars per day
  if (waiting > 0 && spawn()) waiting--; // a customer who finds every bay busy waits for the next free one
  for (const car of cars) stepCar(car, dt);
  cars = cars.filter((c) => !c.dead);
  // idle tour: follow a bay that is doing something interesting
  tourTimer += dt;
  if (tNow - userPickedAt > 14 && tourTimer > 9) {
    tourTimer = 0;
    const washing = bays.filter((b) => b.car && b.car.state === "park").map((b) => b.i);
    if (washing.length) selected = washing[(washing.indexOf(selected) + 1) % washing.length];
  }
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  dtLast = dt;
  if (!paused) {
    step(dt);
    draw();
  }
  frame = visible && !paused ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible && !paused) { last = 0; frame = requestAnimationFrame(tick); } }

// warm start: fill the row so the first look already shows work in progress
function warm() {
  const plan = [[1, 9.5], [3, 3.0], [4, 12.5], [6, 6.5], [7, 0.8]];
  for (const [i, t] of plan) {
    const car = { id: seedN, seed: seedN++, bay: i, state: "park", x: CX[i], y: PARK_Y, h: -Math.PI / 2, v: 0, tone: TONES[i % TONES.length], t, foam: 0, wet: 1 };
    const a = Math.PI + (Math.PI * 3 / WASH) * t;
    const q = ellipse(i, a);
    car.person = { x: q.x, y: q.y, h: Math.atan2(PARK_Y - q.y, CX[i] - q.x), walk: 0, step: "wash", show: true, a };
    const st = stageAt(t);
    if (st && st.kind === "foam") car.foam = Math.min(1, st.at / 2.6);
    if (st && (st.name === "Мойка АВД")) car.foam = Math.max(0, 1 - st.at / 2.4);
    bays[i].car = car;
    cars.push(car);
  }
  served = 0;
  selected = 4;
}
warm();
draw();

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
const seasonBtn = document.querySelector("[data-season]");
seasonBtn.addEventListener("click", () => {
  winter = !winter;
  seasonBtn.setAttribute("aria-pressed", String(winter));
  bays.forEach((b) => { if (b.car && b.car.state === "park" && b.car.person) b.doorTarget = winter ? 0 : 1; else if (!b.car) b.doorTarget = winter ? 0 : 1; });
  run();
});
const pick = (i) => { selected = i; userPickedAt = tNow; lastStatus = ""; draw(); };
chips.forEach((c, i) => c.addEventListener("click", () => pick(i)));
svgEl.addEventListener("click", (event) => {
  // map click to the bay under the pointer using the floor line at door height
  const pt = svgEl.createSVGPoint();
  pt.x = event.clientX; pt.y = event.clientY;
  const sp = pt.matrixTransform(svgEl.getScreenCTM().inverse());
  let best = 0, bestD = 1e9;
  BAYS.forEach((w, i) => {
    const c = iso([CX[i], DEPTH / 2, 10], P);
    const d = Math.hypot(c[0] - sp.x, c[1] - sp.y);
    if (d < bestD) { bestD = d; best = i; }
  });
  pick(best);
});
stage.addEventListener("keydown", (event) => {
  if (/^[1-8]$/.test(event.key)) { pick(Number(event.key) - 1); event.preventDefault(); }
  if (event.key === "ArrowRight") { pick((selected + 1) % 8); event.preventDefault(); }
  if (event.key === "ArrowLeft") { pick((selected + 7) % 8); event.preventDefault(); }
  if (event.key === " ") { event.preventDefault(); setPlaying(paused); }
});
const playBtn = document.querySelector("[data-play]");
const startBtn = document.querySelector("[data-start]");
function setPlaying(on) {
  paused = !on;
  if (on) started = true;
  startBtn.hidden = started;
  playBtn.textContent = on ? "❚❚ Пауза" : "▶ Пуск";
  playBtn.setAttribute("aria-pressed", String(on));
  stage.toggleAttribute("data-paused", !on);
  if (on) run();
}
function resetAll() {
  cars = [];
  bays.forEach((b) => { b.car = null; b.door = 1; b.doorTarget = 1; b.screen = false; b.boom = undefined; });
  served = 0; waiting = 0; simMin = 9 * 60 + 40; nextSpawn = 0.5; tNow = 0; tourTimer = 0; userPickedAt = -99;
  warm(); lastStatus = ""; draw();
}
startBtn.addEventListener("click", () => setPlaying(true));
playBtn.addEventListener("click", () => setPlaying(paused));
document.querySelector("[data-reset]").addEventListener("click", () => { resetAll(); setPlaying(true); });
setPlaying(false);
window.__sw = { frame: (dt) => { step(dt); dtLast = dt; draw(); }, pause: () => { paused = true; }, play: () => setPlaying(true), select: (i) => { selected = i; userPickedAt = 1e9; lastStatus = ''; }, step: (s) => { for (let t = 0; t < s; t += 1 / 30) step(1 / 30); dtLast = 1; draw(); }, cars: () => cars, bays };
run();
